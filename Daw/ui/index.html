<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>slur studio</title>
<style>
@font-face { font-family: 'Instrument Sans'; font-weight: 400 700; font-style: normal; src: url(fonts/instrument-sans-normal-400-700-latin.woff2) }
@font-face { font-family: 'Instrument Sans'; font-weight: 400 700; font-style: italic; src: url(fonts/instrument-sans-italic-400-700-latin.woff2) }
/* one room that takes the size of its window: black paper, white ink, one family of type */
:root { --k1: #151514; --k2: #1B1B1A; --ink: #ECEAE4; --f: 'Instrument Sans', 'Pretendard Variable', 'Apple SD Gothic Neo', system-ui, sans-serif; color-scheme: dark }
html, body { height: 100% }
body { margin: 0; background: var(--k1); color: var(--ink); font-family: var(--f); overflow: hidden; -webkit-user-select: none; user-select: none; cursor: default }
#room { height: 100%; position: relative; overflow: hidden }
#board { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0; background: var(--k1) }
#svg { display: block; touch-action: none }
#svg text { pointer-events: none }
#g-play, #g-drop, #g-rec { pointer-events: none }
#g-play > * { pointer-events: none }
#g-play [data-a] { pointer-events: all }
#cmd { position: absolute; left: 26px; top: 878px; width: 268px; height: 22px; padding: 0; margin: 0; border: 0; outline: 0; border-radius: 0; background: transparent; color: var(--ink); opacity: .94; caret-color: var(--ink); font: 400 10.5px/22px var(--f); -webkit-user-select: text; user-select: text }
#cmd::selection, #pk-q::selection, #rename::selection { background: rgba(236, 234, 228, .26) }
#rename { position: absolute; box-sizing: border-box; padding: 0 4px; margin: 0; border: 1px solid rgba(236, 234, 228, .5); border-radius: 2px; outline: 0; background: #0E0E0E; color: var(--ink); caret-color: var(--ink); -webkit-user-select: text; user-select: text }
#rename[hidden] { display: none }
#st-find { position: absolute; height: 18px; padding: 0; margin: 0; border: 0; outline: 0; border-radius: 0; background: transparent; color: var(--ink); caret-color: var(--ink); font: 400 9.5px/18px var(--f); -webkit-user-select: text; user-select: text }
#st-type { position: absolute; box-sizing: border-box; padding: 0 4px; margin: 0; border: 1px solid rgba(236, 234, 228, .5); border-radius: 2px; outline: 0; background: #0E0E0E; color: var(--ink); caret-color: var(--ink); font: 400 11px var(--f); text-align: center; -webkit-user-select: text; user-select: text }
#st-find[hidden], #st-type[hidden] { display: none }
#st-find::selection, #st-type::selection { background: rgba(236, 234, 228, .26) }
/* the list of plug-ins from outside, opened from the patch */
#picker { position: absolute; left: 24px; top: 474px; width: 304px; height: 338px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--k2); border: 1px solid rgba(236, 234, 228, .28); border-radius: 3px }
#picker[hidden] { display: none }
/* a project being opened: what is being done, and how far along it is */
#loading { position: absolute; width: 340px; box-sizing: border-box; padding: 16px 18px 15px; background: var(--k2); border: 1px solid rgba(236, 234, 228, .28); border-radius: 3px; z-index: 5 }
#loading[hidden] { display: none }
#ld-word { font-size: 9.5px; opacity: .45 }
#ld-name { font-size: 12.5px; font-weight: 500; margin: 3px 0 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
#ld-bar { position: relative; height: 2px; margin-right: 38px; background: rgba(236, 234, 228, .14) }
#ld-note { position: absolute; right: -38px; top: -6px; width: 26px; height: 14px; overflow: visible }      /* a whole note walking a scale on five lines, while the card is up (project.js: ldNote; design/progress motion draft 1, his pick a) */
#ld-fill { height: 2px; width: 0; background: var(--ink) }
#ld-what { font-size: 9.5px; opacity: .6; margin-top: 9px; height: 12px; white-space: pre; overflow: hidden; text-overflow: ellipsis }
/* …on a patch it stands inside the panel, at the right of the chain: a column of the panel, not a card laid over the lanes */
#picker.in { border: 0; border-left: 1px solid rgba(236, 234, 228, .1); border-radius: 0; background: #181817 }
#pk-body { flex: 1; min-height: 0; display: flex }
#pk-cats { flex: 0 0 104px; overflow-y: auto; padding: 0 0 6px 6px; border-right: 1px solid rgba(236, 234, 228, .08) }
#pk-cats[hidden] { display: none }
#pk-cats::-webkit-scrollbar { width: 0 }
.pk-cat { display: flex; align-items: baseline; gap: 6px; width: 100%; box-sizing: border-box; padding: 4px 8px; border: 0; border-radius: 2px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer }
.pk-cat b { font-weight: 400; font-size: 10.5px; opacity: .62; flex: 1 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.pk-cat span { font-size: 9px; opacity: .34 }
.pk-cat:hover b, .pk-cat:focus-visible b { opacity: 1 }
.pk-cat:focus-visible { outline: 0 }
.pk-cat.on { background: rgba(236, 234, 228, .1) }
.pk-cat.on b { opacity: 1; font-weight: 500 }
.pk-cat.on span { opacity: .6 }
#pk-head { display: flex; gap: 7px; align-items: baseline; padding: 13px 14px 7px; font-size: 11.5px; white-space: nowrap; overflow: hidden }
#pk-head b { font-weight: 500 }
#pk-head span { opacity: .45; overflow: hidden; text-overflow: ellipsis }
#pk-q { margin: 0 14px 8px; height: 22px; padding: 0; border: 0; border-bottom: 1px solid rgba(236, 234, 228, .24); border-radius: 0; outline: 0; background: transparent; color: var(--ink); caret-color: var(--ink); font: 400 10.5px var(--f); -webkit-user-select: text; user-select: text }
#pk-list { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 0 6px 6px }
#pk-list::-webkit-scrollbar { width: 6px }
#pk-list::-webkit-scrollbar-thumb { background: rgba(236, 234, 228, .18); border-radius: 3px }
.pk-row { display: flex; align-items: baseline; gap: 8px; width: 100%; box-sizing: border-box; padding: 4px 8px; border: 0; border-radius: 2px; background: transparent; color: inherit; font: inherit; text-align: left; cursor: pointer }
.pk-row:hover, .pk-row:focus-visible { background: rgba(236, 234, 228, .08); outline: 0 }
.pk-row b { font-weight: 400; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 0 1 auto }
.pk-row span { font-size: 9.5px; opacity: .42; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1 1 0; min-width: 0 }
.pk-row i { font-size: 9px; font-style: normal; opacity: .5 }
</style>
</head>
<body>
<div id="room"><div id="board">
<svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" fill="none" role="application" aria-label="slur studio">
<defs><clipPath id="tl"><rect x="292" y="70" width="1148" height="808"/></clipPath><clipPath id="ln"><rect x="292" y="112" width="1148" height="766"/></clipPath><clipPath id="hdc"><rect x="0" y="112" width="292" height="766"/></clipPath></defs>
<g id="g-lanes"></g><g id="g-rec" clip-path="url(#ln)"></g><g id="g-drop"></g><g id="g-head"></g><g id="g-ruler"></g><g id="g-scenes"></g><g id="g-play" clip-path="url(#tl)"></g><g id="g-info"></g><g id="g-dock"></g><g id="g-slur"></g><g id="g-top"></g><g id="g-cmd"></g><g id="g-look"></g><g id="g-hand"></g><g id="g-ask"></g><g id="g-new"></g><g id="g-back"></g><g id="g-sheet"></g><g id="g-start"></g><g id="g-menu"></g>
</svg>
<input id="cmd" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="say what to change">
<input id="rename" type="text" hidden autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="name">
<div id="loading" hidden><div id="ld-word"></div><div id="ld-name"></div><div id="ld-bar"><div id="ld-fill"></div><svg id="ld-note" viewBox="0 0 26 14" aria-hidden="true"></svg></div><div id="ld-what"></div></div>
<div id="picker" hidden><div id="pk-head"></div><input id="pk-q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="find a plug-in"><div id="pk-body"><div id="pk-cats" hidden></div><div id="pk-list"></div></div></div>
</div></div>
<script>
window.__errs = []
addEventListener('error', e => { __errs.push(String(e.message) + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno) })
addEventListener('unhandledrejection', e => { __errs.push('rejection: ' + String((e.reason && e.reason.message) || e.reason)) })
</script>
